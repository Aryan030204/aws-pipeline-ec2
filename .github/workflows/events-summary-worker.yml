name: Events Summary Worker

on:
  push:
    branches:
      - main
  schedule:
    # 18:30 UTC = 00:00 IST next day
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  run-events-summary-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run events summary worker
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MASTER_DB_HOST: ${{ secrets.MASTER_DB_HOST }}
          MASTER_DB_PORT: ${{ secrets.MASTER_DB_PORT }}
          MASTER_DB_USER: ${{ secrets.MASTER_DB_USER }}
          MASTER_DB_PASSWORD: ${{ secrets.MASTER_DB_PASSWORD }}
          MASTER_DB_NAME: ${{ secrets.MASTER_DB_NAME }}
          MASTER_DB_TLS_CA_MODE: ${{ secrets.MASTER_DB_TLS_CA_MODE }}
          MASTER_DB_SSL_VERIFY_CERT: ${{ secrets.MASTER_DB_SSL_VERIFY_CERT }}
          MASTER_DB_SSL_VERIFY_IDENTITY: ${{ secrets.MASTER_DB_SSL_VERIFY_IDENTITY }}
          MASTER_RDS_CA_PATH: ${{ secrets.MASTER_RDS_CA_PATH }}
          MASTER_RDS_CA_BUNDLE_B64: ${{ secrets.MASTER_RDS_CA_BUNDLE_B64 }}
          MASTER_CUSTOM_CA_PATH: ${{ secrets.MASTER_CUSTOM_CA_PATH }}
          MASTER_CUSTOM_CA_BUNDLE_B64: ${{ secrets.MASTER_CUSTOM_CA_BUNDLE_B64 }}
        run: python workers/events_summary_worker.py
