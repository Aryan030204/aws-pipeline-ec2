name: Deploy to EC2

# Only ever fires on a push to master - not on any other branch, and not on
# pull requests. The "production" environment below (configured in repo
# Settings -> Environments, with a required reviewer) is what actually gates
# the run: every trigger sits in "Waiting for review" until an authorized
# reviewer approves it in the Actions tab. See docs/DEPLOYMENT.md for the
# one-time setup this workflow depends on (SSH secrets + environment
# protection rule). Runs on a GitHub-hosted runner and reaches EC2 over SSH
# - nothing needs to be installed on the EC2 box itself.
on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-$HOME/pipelines/aws-pipeline-ec2}"
            echo "Deploying from: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            git fetch origin master
            git checkout master
            git pull origin master

            docker compose build shopify-pipeline events-summary-worker variant-wise-events-worker checkout-login-status-worker
            docker compose up -d shopify-pipeline events-summary-worker variant-wise-events-worker checkout-login-status-worker

            # checkout-login-status-worker's own schedule is once a day
            # (00:05 IST) - fire one immediate one-off run so a deploy
            # doesn't silently wait up to 24h to take effect. Runs as a
            # second process inside the just-restarted container, alongside
            # (not instead of) its normal long-running scheduler.
            docker compose exec -T checkout-login-status-worker \
              python -c "from workers.checkout_login_status_worker import run_worker; run_worker()"

            docker compose ps
