version: "3.9"

networks:
  pipeline-net:
    external: true

services:
  shopify-pipeline:
    build: .
    container_name: aws-pipeline
    env_file:
      - .env
    restart: always
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  events-summary-worker:
    build:
      context: .
      dockerfile: Dockerfile.events-worker
    container_name: events-summary-worker
    env_file:
      - .env
    restart: always
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  variant-wise-events-worker:
    build:
      context: .
      dockerfile: Dockerfile.variant-wise-events-worker
    container_name: variant-wise-events-worker
    env_file:
      - .env
    restart: always
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  checkout-login-status-worker:
    build:
      context: .
      dockerfile: Dockerfile.checkout-login-status-worker
    container_name: checkout-login-status-worker
    env_file:
      - .env
    restart: always
    networks:
      - pipeline-net
    extra_hosts:
      - "host.docker.internal:host-gateway"